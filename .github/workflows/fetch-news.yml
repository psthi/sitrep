name: Fetch News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and process defense signals
        run: node scripts/fetch-news.mjs

      - name: Fetch macroeconomic & financial surveillance
        run: node scripts/fetch-economic.mjs

      - name: Generate intelligence SITREP (optional)
        run: node scripts/generate-briefing.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "z-ai/glm-5.3-flash"
        continue-on-error: true

      - name: Broadcast to Telegram (optional)
        run: node scripts/send-telegram.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "News Bot"
          git config user.email "bot@sitrep.dev"
          git add data/
          git diff --staged --quiet || git commit -m "Update intelligence data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
